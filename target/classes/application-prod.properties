# ═══════════════════════════════════════════════════════════════════════
# EmployeeTrack – PRODUCTION profile (Render + PostgreSQL)
#
# Activated when: SPRING_PROFILES_ACTIVE=prod
#
# All sensitive values come from Render environment variables set via
# render.yaml (fromDatabase) — never hardcoded in source.
# ═══════════════════════════════════════════════════════════════════════

# ── PostgreSQL DataSource ───────────────────────────────────────────────
# DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD are injected by Render
# from the linked PostgreSQL database (see render.yaml → fromDatabase).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────
# Hibernate auto-creates / migrates all tables on first deploy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── HikariCP connection pool (Render free tier: max 97 connections) ────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ── Logging ────────────────────────────────────────────────────────────
logging.level.com.employeetrack=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
