# ═══════════════════════════════════════════════════════════════════════
# EmployeeTrack – Spring Boot Application Properties
#
# LOCAL DEV:  uses MySQL via hardcoded fallback values
# PRODUCTION: Render injects DATABASE_URL, JWT_SECRET, etc. via env vars
#             Set spring.profiles.active=prod to activate production profile
# ═══════════════════════════════════════════════════════════════════════

# Active profile — override with SPRING_PROFILES_ACTIVE=prod on Render
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ── Datasource (local MySQL fallback) ─────────────────────────────────
# On Render with prod profile, these are overridden by application-prod.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employeetrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ── JPA / Hibernate ────────────────────────────────────────────────────
# ddl-auto=update: safe for development; Render prod profile uses 'update' too
# so Hibernate creates/migrates tables automatically on first deploy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Dialect auto-detected by Hibernate — no need to hardcode for prod compatibility
# spring.jpa.properties.hibernate.dialect is intentionally omitted so Hibernate
# auto-selects MySQLDialect locally and PostgreSQLDialect on Render

# ── Server ─────────────────────────────────────────────────────────────
# PORT is injected by Render automatically; local default is 8080
server.port=${PORT:8080}

# ── JWT ────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:EmployeeTrack2024SecretKeyForJWTAuthenticationSystemVeryLongSecureKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── File upload ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Jackson: ISO 8601 strings, not arrays ──────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logging (reduced in base profile) ─────────────────────────────────
logging.level.com.employeetrack=INFO
logging.level.org.springframework.security=WARN
