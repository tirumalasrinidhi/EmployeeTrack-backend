# ═══════════════════════════════════════════════════════════════════════
# EmployeeTrack – Spring Boot Application Properties
#
# LOCAL DEV:  uses MySQL via hardcoded fallback values
# PRODUCTION: Render injects env vars; SPRING_PROFILES_ACTIVE=prod
#             activates application-prod.properties (PostgreSQL)
# ═══════════════════════════════════════════════════════════════════════

# Active profile — Render sets SPRING_PROFILES_ACTIVE=prod via env var
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ── Datasource (local MySQL fallback) ─────────────────────────────────
# On Render with prod profile these are overridden by application-prod.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employeetrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ── JPA / Hibernate ────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Dialect is auto-detected by Hibernate (MySQLDialect locally, PostgreSQLDialect on Render)

# ── Server ─────────────────────────────────────────────────────────────
# Render injects PORT automatically; local default is 8080
server.port=${PORT:8080}

# ── JWT ────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:EmployeeTrack2024SecretKeyForJWTAuthenticationSystemVeryLongSecureKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── File upload ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Jackson: ISO 8601 strings, not arrays ──────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logging ────────────────────────────────────────────────────────────
logging.level.com.employeetrack=INFO
logging.level.org.springframework.security=WARN