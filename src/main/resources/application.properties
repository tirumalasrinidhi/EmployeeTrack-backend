spring.datasource.url=jdbc:mysql://localhost:3306/employeetrack?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT Configuration
jwt.secret=EmployeeTrack2024SecretKeyForJWTAuthenticationSystemVeryLongSecureKey
jwt.expiration=86400000

# Logging
logging.level.com.employeetrack=DEBUG
logging.level.org.springframework.security=DEBUG

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson: serialize LocalDate/LocalTime/LocalDateTime as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false
