# ═══════════════════════════════════════════════════════════════════════
# EmployeeTrack – PRODUCTION profile (Render + PostgreSQL)
#
# Activated when: SPRING_PROFILES_ACTIVE=prod
#
# Converted from Render Internal Database URL:
#   postgresql://employeetrack_database_user:***@dpg-db50sg942hec73fahdt0-a/employeetrack_database
# ═══════════════════════════════════════════════════════════════════════

# ── PostgreSQL DataSource ───────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://dpg-db50sg942hec73fahdt0-a:5432/employeetrack_database
spring.datasource.username=employeetrack_database_user
spring.datasource.password=s48qIuweBApPvs0y4nAEx5LwYzpULWDb
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────
# Hibernate auto-creates / migrates all tables on first deploy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── HikariCP connection pool (Render free tier: max 97 connections) ────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ── Logging ────────────────────────────────────────────────────────────
logging.level.com.employeetrack=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
