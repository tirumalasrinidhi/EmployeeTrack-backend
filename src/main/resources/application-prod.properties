# ═══════════════════════════════════════════════════════════════════════
# EmployeeTrack – PRODUCTION profile (Render + PostgreSQL)
#
# Activated when: SPRING_PROFILES_ACTIVE=prod
#
# Render PostgreSQL provides DATABASE_URL in the format:
#   postgresql://USER:PASSWORD@HOST:PORT/DBNAME
#
# Spring needs it as:
#   jdbc:postgresql://HOST:PORT/DBNAME
#
# Render also provides individual env vars:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#
# We use the individual vars so Spring handles the JDBC URL construction.
# Set these in Render Dashboard → Environment → Add Environment Variable
# ═══════════════════════════════════════════════════════════════════════

# ── PostgreSQL DataSource ───────────────────────────────────────────────
# Render PostgreSQL internal URL (use Internal Database URL for same-region):
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────
# update: Hibernate creates/alters tables automatically on every deploy
# This is safe for initial deployment; migrate to flyway for production maturity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# PostgreSQL-specific: disable open-in-view to avoid connection exhaustion
spring.jpa.open-in-view=false

# Connection pool tuning for Render's free tier (max 97 connections allowed)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ── Logging ────────────────────────────────────────────────────────────
logging.level.com.employeetrack=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
